# The Block Ledger (property-site container). "no-cache" makes browsers check for a newer page or
# data.json on every visit (a cheap ETag check), so the hourly update shows at once.
server {
    listen 80;
    root /usr/share/nginx/html;
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location = /nginx.conf { return 404; }
}
