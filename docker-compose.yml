services:
  propbot:
    networks: [default, scrape-net]   # shared Playwright server ws://playwright:3000/
    build: .
    # Dockge Update/Start rebuilds from the code on disk instead of reusing the old image.
    pull_policy: build
    container_name: sg-property-hunter
    # The NAS user (the owner, uid 1000) so data/ and the vault stay editable from the host.
    user: "1000:10"
    environment:
      PLAYWRIGHT_WS_URL: ws://playwright:3000/
      TZ: Asia/Singapore
    restart: unless-stopped
    init: true
    volumes:
      - .:/app
      # Obsidian vault: movement log, reports, Profile.md and memory (propbot/vault.py)
      - "/volume1/<USER>/Obsidian/SG Property Hunter:/vault"
    healthcheck:
      # the listener touches data/heartbeat every long poll (30 s)
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/app/data/heartbeat') > 300)"]
      interval: 2m
      timeout: 10s
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Family website (The Block Ledger): site/index.html plus data/site/data.json, which propbot rewrites every hour.
  property-site:
    image: nginx:1.27-alpine
    container_name: property-site
    ports:
      - "8782:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./data/site:/usr/share/nginx/html/live:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Public address for the website: its own Tailscale node "blockledger" with Funnel on 443, so the link is
  # https://blockledger.<tailnet>.ts.net and the NAS node (and Vaultwarden on it) is not exposed or renamed.
  # TS_AUTHKEY_BLOCKLEDGER lives in .env; it is only needed for the first login (state is kept in data/tailscale).
  blockledger:
    image: tailscale/tailscale:stable
    pull_policy: always            # newest stable Tailscale on every redeploy
    container_name: blockledger
    hostname: blockledger
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_BLOCKLEDGER:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on: [property-site]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  scrape-net:
    external: true
