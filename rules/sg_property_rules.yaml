  property_tax:
    title: Property tax rates
    value:
      owner_occupied_residential:
        - {width: 12000, rate_pct: 0}
        - {width: 28000, rate_pct: 4}
        - {width: 10000, rate_pct: 6}
        - {width: 25000, rate_pct: 10}
        - {width: 10000, rate_pct: 14}
        - {width: 15000, rate_pct: 20}
        - {width: 40000, rate_pct: 26}
        - {width: null, rate_pct: 32}
      non_owner_occupied_residential:
        - {width: 30000, rate_pct: 12}
        - {width: 15000, rate_pct: 20}
        - {width: 15000, rate_pct: 28}
        - {width: null, rate_pct: 36}
      non_residential_pct: 10
    unit: percent of annual value, by band
    applies_to: [all]
    effective_from: "2025-01-01"
    url: "https://www.iras.gov.sg/taxes/property-tax/property-owners/property-tax-rates"
    checked_at: "2026-10-02"
    check_method: official_search_index
    verified: true
    quote: "Owner-occupier tax rates: 0% on the first $12,000 of Annual Value, 4% on the next $28,000, 6% on the next $10,000, 10% on the next $25,000, 14% on the next $10,000, 20% on the next $15,000, 26% on the next $40,000 and 32% above $140,000. Non-owner-occupier residential rates: 12% on the first $30,000, 20% on the next $15,000, 28% on the next $15,000 and 36% above $60,000. Non-residential properties are taxed at a single flat rate of 10% of the Annual Value."
    note: "IRAS sets the annual value from market rent. propbot estimates it as 12 months of the comparable median rent and labels it as an estimate. One off rebates (2026) are not modelled."
