# Upcoming MRT lines and stations (not open as of 2026-10-02), from LTA pages found through
# lta.gov.sg search results on 2026-10-02. Opening years are as LTA states them.
# lat and lon are filled by OneMap during backfill; they are never typed in by hand.
# status: upcoming, or due (LTA's target window has started; check whether it has opened).
# Stations whose names LTA has not published are listed as line level entries with a count.

meta:
  checked_at: "2026-10-02"
  check_method: official_search_index
  signal_radius_m: 800

sources:
  CRL: https://www.lta.gov.sg/content/ltagov/en/upcoming_projects/rail_expansion/cross_island_line.html
