[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propbot"
version = "0.1.0"
description = "Personal Singapore property research bot that posts one item per Telegram message"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "selectolax>=0.3",
  "lxml>=5.0",
  "beautifulsoup4>=4.12",
  "APScheduler>=3.10,<4",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
propbot = "propbot.cli:main"

[tool.setuptools.packages.find]
include = ["propbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
